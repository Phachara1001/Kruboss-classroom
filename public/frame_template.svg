<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- พื้นที่ทั้งหมดของกรอบ 512x512 -->
  <rect width="512" height="512" fill="#ffffff" />
  
  <!-- เส้นขอบนอกสุด (ขอบเขตที่วาดได้) -->
  <rect width="512" height="512" fill="none" stroke="#22c55e" stroke-width="8" />
  
  <!-- พื้นที่สำหรับวาดกรอบ -->
  <rect width="512" height="512" fill="#dcfce7" opacity="0.3" />

  <!-- รูตรงกลางสำหรับรูปโปรไฟล์ (เวลาใช้งานจริงต้องลบวงกลมนี้ออกให้ทะลุโปร่งใส) -->
  <circle cx="256" cy="256" r="180" fill="#f1f5f9" stroke="#ef4444" stroke-width="4" stroke-dasharray="10,10" />
  
  <!-- เส้นไกด์กึ่งกลาง (Center Guides) -->
  <line x1="256" y1="0" x2="256" y2="512" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="0" y1="256" x2="512" y2="256" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,5" />
  
  <!-- ข้อความอธิบาย -->
  <text x="256" y="240" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ef4444" text-anchor="middle">พื้นที่รูปโปรไฟล์</text>
  <text x="256" y="270" font-family="sans-serif" font-size="16" fill="#64748b" text-anchor="middle">(เวลาเซฟไปใช้จริง ต้องลบวงกลมนี้ออกให้โปร่งใส)</text>
  
  <text x="256" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="#15803d" text-anchor="middle">วาดลวดลายกรอบรูปบริเวณสีเขียวนี้</text>
</svg>
